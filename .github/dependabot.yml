# Configuration Dependabot pour Athalia
# Mises à jour automatiques des dépendances
# RÉACTIVÉ APRÈS CORRECTION DES VULNÉRABILITÉS

version: 2
updates:
  # Mises à jour des dépendances Python
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 3
    assignees:
      - "arkalia-luna-system"
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "automated"
      - "security"
    # Ignorer les mises à jour majeures automatiques
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Mises à jour des GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 2
    assignees:
      - "arkalia-luna-system"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "automated"
      - "ci-cd"
    # Ignorer les actions critiques
    ignore:
      - dependency-name: "actions/checkout"
        update-types: ["version-update:semver-major"]
      - dependency-name: "actions/setup-python"
        update-types: ["version-update:semver-major"]
