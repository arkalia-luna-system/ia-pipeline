name: Generate SBOM

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  generate-sbom:
    name: Generate Software Bill of Materials
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Generate pip-audit SBOM
        run: |
          echo "🔍 Generating pip-audit SBOM..."
          pip-audit -r requirements.txt --format json -o sbom-pip-audit.json || true
          echo "✅ pip-audit SBOM generated"

      - name: Generate requirements.txt SBOM
        run: |
          echo "🔍 Generating requirements.txt SBOM..."
          pip list --format json > sbom-pip-list.json
          echo "✅ pip list SBOM generated"

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v6
        with:
          name: sbom-reports
          path: |
            sbom-pip-audit.json
            sbom-pip-list.json
          retention-days: 30

      - name: SBOM summary
        run: |
          echo "📋 SBOM GENERATION COMPLETED"
          echo "============================="
          echo "📊 Reports generated:"
          echo "  - sbom-pip-audit.json"
          echo "  - sbom-pip-list.json"
          echo "📁 Available in workflow artifacts"
