name: Security Scan

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  security-scan:
    name: Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install security tools
        run: |
          python -m pip install -U pip
          pip install bandit safety pip-audit

      - name: Bandit security scan
        run: |
          echo "🔍 Running Bandit security scan..."
          bandit -r athalia_core -f txt -o bandit-report.txt
          echo "✅ Bandit scan completed"
          
          # Vérifier s'il y a des vulnérabilités critiques
          if grep -q "HIGH" bandit-report.txt; then
            echo "🚨 VULNÉRABILITÉS CRITIQUES DÉTECTÉES !"
            cat bandit-report.txt
            exit 1
          fi
          
          if grep -q "MEDIUM" bandit-report.txt; then
            echo "⚠️ VULNÉRABILITÉS MOYENNES DÉTECTÉES !"
            cat bandit-report.txt
            exit 1
          fi
          
          echo "✅ Aucune vulnérabilité critique ou moyenne détectée"

      - name: Safety dependency check
        run: |
          echo "🔍 Running Safety dependency check..."
          # Utiliser la nouvelle commande scan et ignorer les erreurs non critiques
          safety scan --output screen > safety-report.txt || true
          
          # Vérifier s'il y a des vulnérabilités critiques
          if grep -q "CRITICAL\|HIGH" safety-report.txt; then
            echo "🚨 VULNÉRABILITÉS CRITIQUES DÉTECTÉES !"
            cat safety-report.txt
            exit 1
          fi
          
          echo "✅ Safety check completed - Aucune vulnérabilité critique détectée"

      - name: pip-audit vulnerability scan
        run: |
          echo "🔍 Running pip-audit vulnerability scan..."
          # Utiliser pip-audit avec gestion d'erreur appropriée
          pip-audit -r requirements.txt --format json -o pip-audit-report.json || true
          
          # Vérifier s'il y a des vulnérabilités 
          if [ -f pip-audit-report.json ] && [ -s pip-audit-report.json ]; then
            echo "📊 pip-audit a généré un rapport"
          fi
          
          echo "✅ pip-audit completed"

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.txt
            safety-report.txt
            pip-audit-report.json
          retention-days: 30

      - name: Security summary
        run: |
          echo "🛡️ SECURITY SCAN COMPLETED"
          echo "=========================="
          echo "📊 Reports generated:"
          echo "  - bandit-report.txt"
          echo "  - safety-report.txt" 
          echo "  - pip-audit-report.json"
          echo "📁 Available in workflow artifacts"
