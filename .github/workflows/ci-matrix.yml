# Workflow CI/CD Matrix Ultra-Professionnel pour Athalia
# Teste sur Windows, macOS, Linux + Python 3.10, 3.11, 3.12
# Avec tests, couverture, sécurité et qualité

name: 🚀 CI/CD Matrix Ultra-Pro

on:
  push:
    branches: [main, develop, feature/*]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

env:
  PYTHON_VERSION: "3.10"
  PIP_CACHE_DIR: ~/.cache/pip
  PYTHONUNBUFFERED: 1

jobs:
  # ========================================
  # 🔍 VALIDATION PRÉLIMINAIRE
  # ========================================
  validate:
    name: "🔍 Validation & Structure"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      should-continue: ${{ steps.validate.outputs.should-continue }}

    steps:
      - name: "📥 Checkout Code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "🔍 Validation Structure"
        run: |
          echo "🔍 VALIDATION DE LA STRUCTURE ATHALIA"
          echo "====================================="

          # Vérification des dossiers critiques
          required_dirs=("athalia_core" "tests" "docs" "config")
          for dir in "${required_dirs[@]}"; do
            if [ -d "$dir" ]; then
              echo "✅ $dir - Présent"
            else
              echo "❌ $dir - MANQUANT"
              exit 1
            fi
          done

          # Vérification des fichiers critiques
          required_files=("pyproject.toml" "requirements.txt" "README.md")
          for file in "${required_files[@]}"; do
            if [ -f "$file" ]; then
              echo "✅ $file - Présent"
            else
              echo "❌ $file - MANQUANT"
              exit 1
            fi
          done

          # Vérification de la configuration
          if [ -f "config/makefile/Makefile" ]; then
            echo "✅ Makefile configuré"
          else
            echo "❌ Makefile non configuré"
            exit 1
          fi

          if [ -f "config/mkdocs/mkdocs.yml" ]; then
            echo "✅ MkDocs configuré"
          else
            echo "❌ MkDocs non configuré"
            exit 1
          fi

          echo "🎉 Structure validée - Tests autorisés"
          echo "should-continue=true" >> $GITHUB_OUTPUT

      - name: "📊 Métriques Projet"
        run: |
          echo "📊 MÉTRIQUES ATHALIA"
          echo "===================="
          echo "🐍 Python files: $(find . -name '*.py' | wc -l | tr -d ' ')"
          echo "🧪 Test files: $(find tests/ -name '*.py' | wc -l | tr -d ' ')"
          echo "📚 Doc files: $(find docs/ -name '*.md' | wc -l | tr -d ' ')"
          echo "🔧 Config files: $(find config/ -name '*.yml' -o -name '*.yaml' | wc -l | tr -d ' ')"
          echo "📦 Package: $(pip show athalia-ai 2>/dev/null | grep Version | cut -d' ' -f2 || echo 'Non installé')"

  # ========================================
  # 🧪 TESTS MATRIX MULTI-PLATEFORME
  # ========================================
  test-matrix:
    name: "🧪 Tests Matrix (${{ matrix.os }} + Python ${{ matrix.python }})"
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12"]
        include:
          - os: ubuntu-latest
            python: "3.10"
            cache-key: "ubuntu-3.10"
          - os: macos-latest
            python: "3.11"
            cache-key: "macos-3.11"
          - os: windows-latest
            python: "3.12"
            cache-key: "windows-3.12"

    timeout-minutes: 15

    steps:
      - name: "📥 Checkout Code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "🐍 Setup Python ${{ matrix.python }}"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: "📦 Upgrade pip & Install Dependencies"
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install -e .
          pip install pytest pytest-cov pytest-mock black ruff mypy bandit
          # Stubs pour MyPy (modules non typés)
          pip install types-PyYAML types-requests

      - name: "🔍 Lint & Format Check"
        run: |
          echo "🔍 VÉRIFICATION QUALITÉ CODE"
          echo "============================"

          # Ruff linting
          echo "📝 Ruff linting..."
          ruff check . --output-format=github

          # Black format check
          echo "🎨 Black format check..."
          black --check --diff .

          # MyPy type checking
          echo "🔍 MyPy type checking..."
          mypy athalia_core/ --ignore-missing-imports --no-error-summary --warn-unused-ignores || echo "⚠️  MyPy a trouvé des problèmes de type (non bloquant)"

      - name: "🧪 Tests avec Couverture"
        run: |
          echo "🧪 LANCEMENT DES TESTS"
          echo "======================"

          # Tests avec couverture (syntaxe compatible multi-OS)
          pytest --cov=athalia_core --cov-report=term --cov-report=xml --cov-report=html --cov-fail-under=80 --maxfail=5 --durations=10 --tb=short -v

      - name: "📊 Upload Coverage to Codecov"
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: "📦 Upload Coverage HTML"
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-${{ matrix.os }}-${{ matrix.python }}
          path: htmlcov/
          retention-days: 30

  # ========================================
  # 🛡️ SÉCURITÉ & QUALITÉ
  # ========================================
  security-audit:
    name: "🛡️ Audit Sécurité & Qualité"
    needs: validate
    # if: needs.validate.outputs.should-continue == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "📥 Checkout Code"
        uses: actions/checkout@v4

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: "📦 Install Security Tools"
        run: |
          pip install bandit safety pip-audit

      - name: "🔒 Bandit Security Scan"
        run: |
          echo "🔒 SCAN SÉCURITÉ BANDIT"
          echo "========================"
          bandit -r athalia_core/ -f json -o bandit-report.json || true
          bandit -r athalia_core/ -f txt -o bandit-report.txt || true

      - name: "📦 Pip Audit"
        run: |
          echo "📦 AUDIT DÉPENDANCES PIP"
          echo "========================"
          pip-audit -r requirements.txt --format json --output pip-audit.json || true
          pip-audit -r requirements.txt --format text --output pip-audit.txt || true

      - name: "🛡️ Safety Check"
        run: |
          echo "🛡️ VÉRIFICATION SAFETY"
          echo "======================="
          safety check -r requirements.txt --json --output safety-report.json || true
          safety check -r requirements.txt --text --output safety-report.txt || true

      - name: "📊 Upload Security Reports"
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            *-report.json
            *-report.txt
          retention-days: 90

  # ========================================
  # 🚀 BUILD & PACKAGE
  # ========================================
  build-package:
    name: "🚀 Build & Package"
    needs: [validate, test-matrix]
    if: needs.validate.outputs.should-continue == 'true' && always()
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "📥 Checkout Code"
        uses: actions/checkout@v4

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: "📦 Install Build Tools"
        run: |
          pip install build twine

      - name: "🔨 Build Package"
        run: |
          echo "🔨 CONSTRUCTION DU PACKAGE"
          echo "=========================="
          python -m build --sdist --wheel
          ls -la dist/

      - name: "📊 Upload Build Artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/
          retention-days: 30

  # ========================================
  # 📚 DOCUMENTATION & PAGES
  # ========================================
  build-docs:
    name: "📚 Build Documentation"
    needs: [validate, test-matrix]
    if: needs.validate.outputs.should-continue == 'true' && always()
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: "📥 Checkout Code"
        uses: actions/checkout@v4

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: "📦 Install MkDocs"
        run: |
          pip install mkdocs mkdocs-material

      - name: "📚 Build Documentation"
        run: |
          echo "📚 CONSTRUCTION DOCUMENTATION"
          echo "============================="
          mkdocs build -f config/mkdocs/mkdocs.yml
          ls -la site/

      - name: "📊 Upload Documentation"
        uses: actions/upload-artifact@v4
        with:
          name: documentation-site
          path: site/
          retention-days: 30

  # ========================================
  # 🎯 RAPPORT FINAL
  # ========================================
  final-report:
    name: "🎯 Rapport Final CI/CD"
    needs: [validate, test-matrix, security-audit, build-package, build-docs]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: "📊 Génération Rapport Final"
        run: |
          echo "🎯 RAPPORT FINAL CI/CD ATHALIA"
          echo "==============================="
          echo "✅ Validation: ${{ needs.validate.result }}"
          echo "🧪 Tests Matrix: ${{ needs.test-matrix.result }}"
          echo "🛡️ Sécurité: ${{ needs.security-audit.result }}"
          echo "🚀 Build: ${{ needs.build-package.result }}"
          echo "📚 Documentation: ${{ needs.build-docs.result }}"
          echo ""
          echo "🌐 Résultats disponibles dans les artifacts"
          echo "📊 Coverage: Codecov + HTML reports"
          echo "🛡️ Sécurité: Bandit + Safety + Pip-audit"
          echo "📦 Package: Wheel + Source distribution"
          echo "📚 Site: Documentation statique"
