# Workflow Release Automatique pour Athalia
# Upload automatique sur PyPI + GitHub Releases

name: 🚀 Release Automatique

on:
  push:
    tags:
      - "v*" # v0.1.0, v1.0.0, etc.
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (ex: v0.1.0)"
        required: true
        default: "v0.1.0"

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ========================================
  # 🔍 VALIDATION PRÉ-RELEASE
  # ========================================
  validate:
    name: "🔍 Validation Pré-Release"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "📥 Checkout Code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: "📦 Install Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install build twine

      - name: "🔍 Validation Structure"
        run: |
          echo "🔍 VALIDATION STRUCTURE RELEASE"
          echo "==============================="

          # Vérifier les fichiers critiques
          required_files=("pyproject.toml" "README.md" "LICENSE")
          for file in "${required_files[@]}"; do
            if [ -f "$file" ]; then
              echo "✅ $file - Présent"
            else
              echo "❌ $file - MANQUANT"
              exit 1
            fi
          done

          # Vérifier la configuration
          if [ -f "config/makefile/Makefile" ]; then
            echo "✅ Makefile configuré"
          else
            echo "❌ Makefile non configuré"
            exit 1
          fi

          if [ -f "config/mkdocs/mkdocs.yml" ]; then
            echo "✅ MkDocs configuré"
          else
            echo "❌ MkDocs non configuré"
            exit 1
          fi

          echo "🎉 Structure validée - Release autorisée"

      - name: "🧪 Tests Critiques"
        run: |
          echo "🧪 TESTS CRITIQUES"
          echo "=================="
          python -m pytest --maxfail=1 -q
          echo "✅ Tests critiques passés"

      - name: "🔍 Lint & Format"
        run: |
          echo "🔍 VÉRIFICATION QUALITÉ"
          echo "======================="
          ruff check .
          black --check .
          echo "✅ Qualité validée"

  # ========================================
  # 🏗️ BUILD & PACKAGE
  # ========================================
  build:
    name: "🏗️ Build & Package"
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: "📥 Checkout Code"
        uses: actions/checkout@v4

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: "📦 Install Build Tools"
        run: |
          pip install build twine

      - name: "🔨 Build Package"
        run: |
          echo "🔨 CONSTRUCTION DU PACKAGE"
          echo "=========================="
          python -m build --sdist --wheel
          ls -la dist/

          # Vérifier le contenu
          echo "📦 Contenu du package:"
          tar -tzf dist/*.tar.gz | head -20

      - name: "📊 Upload Build Artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/
          retention-days: 90

  # ========================================
  # 📚 DOCUMENTATION & PAGES
  # ========================================
  build-docs:
    name: "📚 Build Documentation"
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "📥 Checkout Code"
        uses: actions/checkout@v4

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: "📦 Install MkDocs"
        run: |
          pip install mkdocs mkdocs-material

      - name: "📚 Build Documentation"
        run: |
          echo "📚 CONSTRUCTION DOCUMENTATION"
          echo "============================="
          mkdocs build -f config/mkdocs/mkdocs.yml
          ls -la site/

      - name: "📊 Upload Documentation"
        uses: actions/upload-artifact@v4
        with:
          name: documentation-site
          path: site/
          retention-days: 90

  # ========================================
  # 🚀 UPLOAD PYPI
  # ========================================
  upload-pypi:
    name: "🚀 Upload PyPI"
    needs: [validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "📥 Checkout Code"
        uses: actions/checkout@v4

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: "📦 Install Twine"
        run: |
          pip install twine

      - name: "🔍 Check Package"
        run: |
          echo "🔍 VÉRIFICATION PACKAGE"
          echo "======================="
          twine check dist/*
          echo "✅ Package validé"

      - name: "🚀 Upload to PyPI"
        run: |
          echo "🚀 UPLOAD SUR PYPI"
          echo "==================="
          twine upload --username ${{ secrets.PYPI_USERNAME }} --password ${{ secrets.PYPI_PASSWORD }} dist/*
          echo "✅ Package uploadé sur PyPI"

      - name: "📊 Upload PyPI Artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: pypi-upload
          path: dist/
          retention-days: 90

  # ========================================
  # 🏷️ GITHUB RELEASE
  # ========================================
  create-release:
    name: "🏷️ GitHub Release"
    needs: [validate, build, build-docs, upload-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "📥 Checkout Code"
        uses: actions/checkout@v4

      - name: "📋 Get Release Info"
        id: release_info
        run: |
          # Extraire la version du tag
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$VERSION" >> $GITHUB_OUTPUT

          # Extraire la version sans le 'v'
          VERSION_NUMBER=${VERSION#v}
          echo "version_number=$VERSION_NUMBER" >> $GITHUB_OUTPUT

          echo "🚀 Création release: $VERSION"

      - name: "📥 Download Artifacts"
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: dist/

      - name: "📚 Download Documentation"
        uses: actions/download-artifact@v4
        with:
          name: documentation-site
          path: docs/

      - name: "📦 Create Release Assets"
        run: |
          echo "📦 CRÉATION ASSETS RELEASE"
          echo "=========================="

          # Créer un zip avec la documentation
          cd docs
          zip -r ../athalia-docs-${{ steps.release_info.outputs.version_number }}.zip .
          cd ..

          # Créer un zip avec les artefacts
          zip -r athalia-artifacts-${{ steps.release_info.outputs.version_number }}.zip dist/ docs/

          ls -la *.zip

      - name: "🏷️ Create GitHub Release"
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          release_name: "Athalia ${{ steps.release_info.outputs.version_number }}"
          body: |
            🚀 **ATHALIA ${{ steps.release_info.outputs.version_number }}** - Release Majeure

            ## 🎯 **Nouveautés**
            - ✅ Makefile professionnel organisé
            - ✅ CI/CD Matrix multi-OS + multi-Python
            - ✅ Configuration MkDocs pour GitHub Pages
            - ✅ Badges GitHub professionnels
            - ✅ Container Docker multi-stage
            - ✅ Projet démo en 1 commande
            - ✅ Upload automatique PyPI

            ## 📦 **Installation**
            ```bash
            pip install athalia-ai
            ```

            ## 🚀 **Utilisation**
            ```bash
            athalia --help
            ```

            ## 📚 **Documentation**
            - [Site Web](https://arkalia-luna-system.github.io/ia-pipeline)
            - [GitHub](https://github.com/arkalia-luna-system/ia-pipeline)

            ## 🔧 **Configuration**
            - [Makefile](config/makefile/)
            - [MkDocs](config/mkdocs/)
            - [CI/CD](config/ci-cd/)
            - [Badges](config/badges/)

            ## 🐳 **Docker**
            ```bash
            docker-compose -f config/docker/docker-compose.yml up athalia
            ```

            ## 🎭 **Démo**
            ```bash
            make -f config/makefile/Makefile demo
            ```

            ---

            *Release maintenue par l'équipe Athalia - DevOps Automation Platform*
          draft: false
          prerelease: false

      - name: "📤 Upload Release Assets"
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./athalia-docs-${{ steps.release_info.outputs.version_number }}.zip
          asset_name: athalia-docs-${{ steps.release_info.outputs.version_number }}.zip
          asset_content_type: application/zip

      - name: "📦 Upload Release Assets"
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./athalia-artifacts-${{ steps.release_info.outputs.version_number }}.zip
          asset_name: athalia-artifacts-${{ steps.release_info.outputs.version_number }}.zip
          asset_content_type: application/zip

  # ========================================
  # 🎯 RAPPORT FINAL
  # ========================================
  final-report:
    name: "🎯 Rapport Final Release"
    needs: [validate, build, build-docs, upload-pypi, create-release]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: "📊 Génération Rapport Final"
        run: |
          echo "🎯 RAPPORT FINAL RELEASE ATHALIA"
          echo "================================="
          echo "✅ Validation: ${{ needs.validate.result }}"
          echo "🏗️ Build: ${{ needs.build.result }}"
          echo "📚 Documentation: ${{ needs.build-docs.result }}"
          echo "🚀 PyPI: ${{ needs.upload-pypi.result }}"
          echo "🏷️ GitHub Release: ${{ needs.create-release.result }}"
          echo ""
          echo "🌐 Résultats disponibles:"
          echo "📦 Package: PyPI + GitHub Releases"
          echo "📚 Documentation: Site web + PDF"
          echo "🐳 Docker: Container + docker-compose"
          echo "🎭 Démo: Projet exemple complet"
