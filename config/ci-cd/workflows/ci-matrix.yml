# Workflow CI/CD Matrix Pro mais Accessible pour Athalia
# Teste sur Windows, macOS, Linux + Python 3.10, 3.11, 3.12
# Avec tests, couverture, sécurité et qualité - Version Assouplie

name: 🚀 CI/CD Matrix Pro-Accessible

on:
  push:
    branches: [main, develop, feature/*]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production

env:
  PYTHON_VERSION: "3.10"
  PIP_CACHE_DIR: ~/.cache/pip
  PYTHONUNBUFFERED: 1

jobs:
  # ========================================
  # 🔍 VALIDATION PRÉLIMINAIRE (Assouplie)
  # ========================================
  validate:
    name: "🔍 Validation & Structure (Flexible)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should-continue: ${{ steps.validate.outputs.should-continue }}
    
    steps:
      - name: "📥 Checkout Code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: "🔍 Validation Structure (Assouplie)"
        run: |
          echo "🔍 VALIDATION DE LA STRUCTURE ATHALIA (FLEXIBLE)"
          echo "==============================================="
          
          # Vérification des dossiers critiques (plus flexible)
          critical_dirs=("athalia_core")
          optional_dirs=("tests" "docs" "config")
          
          echo "📁 Dossiers critiques:"
          for dir in "${critical_dirs[@]}"; do
            if [ -d "$dir" ]; then
              echo "✅ $dir - Présent"
            else
              echo "❌ $dir - MANQUANT (CRITIQUE)"
              exit 1
            fi
          done
          
          echo "📁 Dossiers optionnels:"
          missing_optional=0
          for dir in "${optional_dirs[@]}"; do
            if [ -d "$dir" ]; then
              echo "✅ $dir - Présent"
            else
              echo "⚠️  $dir - Manquant (optionnel)"
              missing_optional=$((missing_optional + 1))
            fi
          done
          
          # Vérification des fichiers critiques (plus flexible)
          critical_files=("pyproject.toml")
          optional_files=("requirements.txt" "README.md")
          
          echo "📄 Fichiers critiques:"
          for file in "${critical_files[@]}"; do
            if [ -f "$file" ]; then
              echo "✅ $file - Présent"
            else
              echo "❌ $file - MANQUANT (CRITIQUE)"
              exit 1
            fi
          done
          
          echo "📄 Fichiers optionnels:"
          for file in "${optional_files[@]}"; do
            if [ -f "$file" ]; then
              echo "✅ $file - Présent"
            else
              echo "⚠️  $file - Manquant (optionnel)"
            fi
          done
          
          # Vérification de la configuration (optionnelle)
          echo "🔧 Configuration (optionnelle):"
          if [ -f "config/makefile/Makefile" ]; then
            echo "✅ Makefile configuré"
          else
            echo "⚠️  Makefile non configuré (optionnel)"
          fi
          
          if [ -f "config/mkdocs/mkdocs.yml" ]; then
            echo "✅ MkDocs configuré"
          else
            echo "⚠️  MkDocs non configuré (optionnel)"
          fi
          
          echo "🎉 Structure validée - Tests autorisés"
          echo "should-continue=true" >> $GITHUB_OUTPUT
      
      - name: "📊 Métriques Projet"
        run: |
          echo "📊 MÉTRIQUES ATHALIA"
          echo "===================="
          echo "🐍 Python files: $(find . -name '*.py' | wc -l | tr -d ' ')"
          echo "🧪 Test files: $(find tests/ -name '*.py' 2>/dev/null | wc -l | tr -d ' ' || echo '0')"
          echo "📚 Doc files: $(find docs/ -name '*.md' 2>/dev/null | wc -l | tr -d ' ' || echo '0')"
          echo "🔧 Config files: $(find config/ -name '*.yml' -o -name '*.yaml' 2>/dev/null | wc -l | tr -d ' ' || echo '0')"
          echo "📦 Package: $(pip show athalia-ai 2>/dev/null | grep Version | cut -d' ' -f2 || echo 'Non installé')"

  # ========================================
  # 🧪 TESTS MATRIX MULTI-PLATEFORME (Assouplie)
  # ========================================
  test-matrix:
    name: "🧪 Tests Matrix (${{ matrix.os }} + Python ${{ matrix.python }})"
    needs: validate
    if: needs.validate.outputs.should-continue == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12"]
        include:
          - os: ubuntu-latest
            python: "3.10"
            cache-key: "ubuntu-3.10"
          - os: macos-latest
            python: "3.11"
            cache-key: "macos-3.11"
          - os: windows-latest
            python: "3.12"
            cache-key: "windows-3.12"
    
    timeout-minutes: 20
    
    steps:
      - name: "📥 Checkout Code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: "🐍 Setup Python ${{ matrix.python }}"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt
      
      - name: "📦 Upgrade pip & Install Dependencies"
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Installation plus flexible des dépendances
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          fi
          pip install -e .
          pip install pytest pytest-cov pytest-mock black ruff mypy bandit
      
      - name: "🔍 Lint & Format Check (Assouplie)"
        run: |
          echo "🔍 VÉRIFICATION QUALITÉ CODE (ASSOUPLIE)"
          echo "========================================="
          
          # Ruff linting (plus permissif)
          echo "📝 Ruff linting..."
          ruff check . --output-format=github --exit-non-zero-on-fixable || echo "⚠️  Ruff a trouvé des problèmes (non bloquant)"
          
          # Black format check (plus permissif)
          echo "🎨 Black format check..."
          black --check --diff . || echo "⚠️  Black a trouvé des problèmes de format (non bloquant)"
          
          # MyPy type checking (plus permissif)
          echo "🔍 MyPy type checking..."
          mypy athalia_core/ --ignore-missing-imports --no-error-summary --warn-unused-ignores || echo "⚠️  MyPy a trouvé des problèmes de type (non bloquant)"
      
      - name: "🧪 Tests avec Couverture (Assouplie)"
        run: |
          echo "🧪 LANCEMENT DES TESTS (ASSOUPLIE)"
          echo "==================================="
          
          # Tests avec couverture plus flexible
          pytest --cov=athalia_core \
                 --cov-report=term \
                 --cov-report=xml \
                 --cov-report=html \
                 --cov-fail-under=60 \
                 --maxfail=10 \
                 --durations=10 \
                 --tb=short \
                 -v || echo "⚠️  Certains tests ont échoué (non bloquant)"
      
      - name: "📊 Upload Coverage to Codecov"
        uses: codecov/codecov-action@v5
        if: always()
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}
      
      - name: "📦 Upload Coverage HTML"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-html-${{ matrix.os }}-${{ matrix.python }}
          path: htmlcov/
          retention-days: 30

  # ========================================
  # 🛡️ SÉCURITÉ & QUALITÉ (Assouplie)
  # ========================================
  security-audit:
    name: "🛡️ Audit Sécurité & Qualité (Assouplie)"
    needs: validate
    if: needs.validate.outputs.should-continue == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: "📥 Checkout Code"
        uses: actions/checkout@v4
      
      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      
      - name: "📦 Install Security Tools"
        run: |
          pip install bandit safety pip-audit
      
      - name: "🔒 Bandit Security Scan (Assouplie)"
        run: |
          echo "🔒 SCAN SÉCURITÉ BANDIT (ASSOUPLIE)"
          echo "====================================="
          # Bandit plus permissif
          bandit -r athalia_core/ -f json -o bandit-report.json -ll || echo "⚠️  Bandit a trouvé des problèmes (non bloquant)"
          bandit -r athalia_core/ -f txt -o bandit-report.txt -ll || echo "⚠️  Bandit a trouvé des problèmes (non bloquant)"
      
      - name: "📦 Pip Audit (Assouplie)"
        run: |
          echo "📦 AUDIT DÉPENDANCES PIP (ASSOUPLIE)"
          echo "====================================="
          if [ -f "requirements.txt" ]; then
            pip-audit -r requirements.txt --format json --output pip-audit.json || echo "⚠️  Pip-audit a trouvé des problèmes (non bloquant)"
            pip-audit -r requirements.txt --format text --output pip-audit.txt || echo "⚠️  Pip-audit a trouvé des problèmes (non bloquant)"
          else
            echo "⚠️  requirements.txt non trouvé - audit ignoré"
          fi
      
      - name: "🛡️ Safety Check (Assouplie)"
        run: |
          echo "🛡️ VÉRIFICATION SAFETY (ASSOUPLIE)"
          echo "===================================="
          if [ -f "requirements.txt" ]; then
            safety check -r requirements.txt --json --output safety-report.json || echo "⚠️  Safety a trouvé des problèmes (non bloquant)"
            safety check -r requirements.txt --text --output safety-report.txt || echo "⚠️  Safety a trouvé des problèmes (non bloquant)"
          else
            echo "⚠️  requirements.txt non trouvé - safety ignoré"
          fi
      
      - name: "📊 Upload Security Reports"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            *-report.json
            *-report.txt
          retention-days: 90

  # ========================================
  # 🚀 BUILD & PACKAGE (Assouplie)
  # ========================================
  build-package:
    name: "🚀 Build & Package (Assouplie)"
    needs: [validate, test-matrix]
    if: needs.validate.outputs.should-continue == 'true' && always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: "📥 Checkout Code"
        uses: actions/checkout@v4
      
      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      
      - name: "📦 Install Build Tools"
        run: |
          pip install build twine
      
      - name: "🔨 Build Package (Assouplie)"
        run: |
          echo "🔨 CONSTRUCTION DU PACKAGE (ASSOUPLIE)"
          echo "======================================"
          # Build plus permissif
          python -m build --sdist --wheel || echo "⚠️  Build a échoué (non bloquant)"
          ls -la dist/ || echo "⚠️  Dossier dist non trouvé"
      
      - name: "📊 Upload Build Artifacts"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-artifacts
          path: dist/
          retention-days: 30

  # ========================================
  # 📚 DOCUMENTATION & PAGES (Assouplie)
  # ========================================
  build-docs:
    name: "📚 Build Documentation (Assouplie)"
    needs: [validate, test-matrix]
    if: needs.validate.outputs.should-continue == 'true' && always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: "📥 Checkout Code"
        uses: actions/checkout@v4
      
      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      
      - name: "📦 Install MkDocs"
        run: |
          pip install mkdocs mkdocs-material
      
      - name: "📚 Build Documentation (Assouplie)"
        run: |
          echo "📚 CONSTRUCTION DOCUMENTATION (ASSOUPLIE)"
          echo "========================================="
          # Build docs plus permissif
          if [ -f "config/mkdocs/mkdocs.yml" ]; then
            mkdocs build -f config/mkdocs/mkdocs.yml || echo "⚠️  Build docs a échoué (non bloquant)"
            ls -la site/ || echo "⚠️  Dossier site non trouvé"
          else
            echo "⚠️  mkdocs.yml non trouvé - build docs ignoré"
          fi
      
      - name: "📊 Upload Documentation"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: documentation-site
          path: site/
          retention-days: 30

  # ========================================
  # 🎯 RAPPORT FINAL (Assouplie)
  # ========================================
  final-report:
    name: "🎯 Rapport Final CI/CD (Assouplie)"
    needs: [validate, test-matrix, security-audit, build-package, build-docs]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: "📊 Génération Rapport Final (Assouplie)"
        run: |
          echo "🎯 RAPPORT FINAL CI/CD ATHALIA (ASSOUPLIE)"
          echo "==========================================="
          echo "✅ Validation: ${{ needs.validate.result }}"
          echo "🧪 Tests Matrix: ${{ needs.test-matrix.result }}"
          echo "🛡️ Sécurité: ${{ needs.security-audit.result }}"
          echo "🚀 Build: ${{ needs.build-package.result }}"
          echo "📚 Documentation: ${{ needs.build-docs.result }}"
          echo ""
          echo "🌐 Résultats disponibles dans les artifacts"
          echo "📊 Coverage: Codecov + HTML reports (seuil 60%)"
          echo "🛡️ Sécurité: Bandit + Safety + Pip-audit (non bloquant)"
          echo "📦 Package: Wheel + Source distribution (non bloquant)"
          echo "📚 Site: Documentation statique (non bloquant)"
          echo ""
          echo "🎉 Workflow CI/CD Pro mais Accessible !"
          echo "💡 Les erreurs ne bloquent plus le processus"
          echo "🚀 Parfait pour l'apprentissage et le développement"
