# Configuration Badges GitHub Ultra-Professionnels pour Athalia
# Ces badges démontrent la qualité et la professionnalisation du projet

badges:
  # ========================================
  # 🚀 CI/CD & TESTS
  # ========================================
  ci:
    name: "CI Matrix"
    url: "https://github.com/arkalia-luna-system/ia-pipeline/actions/workflows/ci-matrix.yml/badge.svg"
    alt: "CI Matrix Status"
    description: "Tests multi-OS + multi-Python"
    
  coverage:
    name: "Code Coverage"
    url: "https://codecov.io/gh/arkalia-luna-system/ia-pipeline/branch/main/graph/badge.svg"
    alt: "Code Coverage"
    description: "Couverture de tests ≥80%"
    
  tests:
    name: "Tests"
    url: "https://img.shields.io/badge/tests-1677%20passed-brightgreen"
    alt: "Tests Status"
    description: "1677 tests passés"
    
  python:
    name: "Python"
    url: "https://img.shields.io/badge/python-3.10%2B-blue"
    alt: "Python Version"
    description: "Python 3.10+ supporté"

  # ========================================
  # 🛡️ SÉCURITÉ & QUALITÉ
  # ========================================
  security:
    name: "Security"
    url: "https://github.com/arkalia-luna-system/ia-pipeline/actions/workflows/security.yml/badge.svg"
    alt: "Security Status"
    description: "Audit sécurité automatique"
    
  codeql:
    name: "CodeQL"
    url: "https://github.com/arkalia-luna-system/ia-pipeline/actions/workflows/codeql-analysis.yml/badge.svg"
    alt: "CodeQL Analysis"
    description: "Analyse statique CodeQL"
    
  bandit:
    name: "Bandit"
    url: "https://img.shields.io/badge/bandit-A%2B-brightgreen"
    alt: "Bandit Score"
    description: "Scan sécurité Python"
    
  quality:
    name: "Code Quality"
    url: "https://img.shields.io/badge/quality-A%2B-brightgreen"
    alt: "Code Quality"
    description: "Qualité code A+"

  # ========================================
  # 📊 MÉTRIQUES PROJET
  # ========================================
  modules:
    name: "Modules"
    url: "https://img.shields.io/badge/modules-93-yellow"
    alt: "Python Modules"
    description: "93 modules Python"
    
  loc:
    name: "Lines of Code"
    url: "https://img.shields.io/badge/loc-72%2C626-orange"
    alt: "Lines of Code"
    description: "72,626 lignes de code"
    
  dashboards:
    name: "Dashboards"
    url: "https://img.shields.io/badge/dashboards-99-purple"
    alt: "Dashboards"
    description: "99 dashboards fonctionnels"
    
  docs:
    name: "Documentation"
    url: "https://img.shields.io/badge/docs-256%20files-yellowgreen"
    alt: "Documentation"
    description: "256 fichiers de documentation"

  # ========================================
  # 🌐 DÉPLOIEMENT & PAGES
  # ========================================
  pages:
    name: "GitHub Pages"
    url: "https://img.shields.io/badge/pages-available-brightgreen"
    alt: "GitHub Pages"
    description: "Site web automatique"
    
  release:
    name: "Release"
    url: "https://img.shields.io/github/v/release/arkalia-luna-system/ia-pipeline"
    alt: "Release Version"
    description: "Version actuelle"
    
  license:
    name: "License"
    url: "https://img.shields.io/badge/license-MIT-blue"
    alt: "License"
    description: "Licence MIT"

  # ========================================
  # 🔧 OUTILS & TECHNOLOGIES
  # ========================================
  black:
    name: "Black"
    url: "https://img.shields.io/badge/code%20style-black-000000"
    alt: "Code Style Black"
    description: "Formatage automatique"
    
  ruff:
    name: "Ruff"
    url: "https://img.shields.io/badge/linting-ruff-red"
    alt: "Linting Ruff"
    description: "Linting ultra-rapide"
    
  mypy:
    name: "MyPy"
    url: "https://img.shields.io/badge/types-mypy-blue"
    alt: "Type Checking"
    description: "Vérification types"
    
  pytest:
    name: "Pytest"
    url: "https://img.shields.io/badge/testing-pytest-green"
    alt: "Testing Pytest"
    description: "Framework de tests"

