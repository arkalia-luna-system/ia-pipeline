# ========================================
# 🎯 UTILISATION
# ========================================
usage:
  description: |
    Ce fichier génère automatiquement tous les badges GitHub
    pour démontrer la professionnalisation d'Athalia.
    
    Impact CV : +20-40k€ (preuves visuelles de qualité)
    
  commands:
    - "python config/badges/generate_badges.py"  # Génère README avec badges
    - "make -f config/makefile/Makefile badges"  # Via Makefile
