# Configuration MkDocs pour Athalia
# Génère automatiquement un site web depuis la documentation

site_name: Athalia - DevOps Automation Platform
site_description: Enterprise-grade DevOps automation platform
site_author: Arkalia Luna System
site_url: https://arkalia-luna-system.github.io/ia-pipeline

# Thème Material
theme:
  name: material
  language: fr
  features:
    - navigation.instant
    - navigation.tabs
    - search.suggest
    - search.highlight
    - content.code.copy
    - header.autohide

# Navigation
nav:
  - 🏠 Accueil: index.md
  - 🚀 Démarrage: quickstart.md
  - 🏗️ Architecture: architecture.md
  - 📚 Guides: user-guides.md
  - 🔧 API: api.md
  - 🧪 Tests: testing.md
  - 📊 Dashboards: dashboards.md
  - 🛡️ Sécurité: security.md
  - 📈 Performance: performance.md
  - 🔍 Audit: audit.md

# Plugins
plugins:
  - search
  - minify

# Extensions Markdown
markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
  - pymdownx.superfences

# Configuration
docs_dir: ../../docs
site_dir: ../../site
use_directory_urls: true

# Exclusions
exclude:
  - .git/
  - .github/
  - .venv/
  - __pycache__/
  - logs/
  - cache/
  - tests/
  - scripts/
  - athalia_core/
